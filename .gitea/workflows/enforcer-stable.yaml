name: 'Check stable branch'

on:
  pull_request:
    branches:
      - stable
jobs:
  check_stable_branch:
    runs-on: ubuntu-latest
    steps:
      # - name: cek
        # run: echo "base ${{ gitea.base_ref }} , head ref ${{ gitea.head_ref }}"
      - name: Check branch
        if: gitea.base_ref == 'stable' && gitea.head_ref != 'tstable'
        # if: gitea.base_ref != 'stable'
        run: |
          echo "ERROR: You can only merge to ${{gitea.base_ref}} from ${{ gitea.head_ref }}."
          exit 1          
